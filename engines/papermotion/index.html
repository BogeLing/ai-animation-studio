<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>papermotion</title>
  <style>
    /* Bundled in public/fonts/ (SIL OFL 1.1), so rendering needs no network. A face downloads only when used. */
    @font-face { font-family: Montserrat; src: url(/fonts/Montserrat-VF.woff2) format('woff2'); font-weight: 100 900; font-display: swap; }
  </style>
  <style>body { margin: 0; background: #111; } canvas, video { display: block; max-width: 100vw; max-height: 100vh; margin: auto; } p { color: #ddd; font: 16px/1.5 system-ui, sans-serif; text-align: center; margin-top: 40vh; } a { color: #8fd0cc; }</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <!-- See examples/play.ts for the URL options. -->
  <script type="module" src="/examples/play.ts"></script>
</body>
</html>
